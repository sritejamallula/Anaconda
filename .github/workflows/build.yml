name: Java CI/CD Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java Sources
      run: |
        mkdir -p bin
        find src -name "*.java" > sources.txt
        javac -d bin -encoding UTF-8 @sources.txt

    - name: Run Verification Test Suite
      run: |
        java -cp bin GameVerificationTest

    - name: Package Standalone Executable JAR
      run: |
        jar --create --file Anaconda.jar --main-class Main -C bin . assets

    - name: Upload Runnable Game JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anaconda-Game-Executable
        path: Anaconda.jar
